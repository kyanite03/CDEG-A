# Save as .github/workflows/deploy.yml in the repo root
name: Build and deploy to Aliyun OSS

on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a manual "Run workflow" button in the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: true  # if two pushes land close together, only the latest deploys

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Set up ossutil
        uses: yizhoumo/setup-ossutil@v2
        with:
          endpoint: oss-cn-hongkong.aliyuncs.com
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Deploy to OSS
        run: ossutil cp -r -f _site/ oss://cdeg-a/

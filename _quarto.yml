project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "**/*.qmd"
  resources:
    - data/
    - assets/vendor/
    - assets/csv-table.js
    - assets/scenarios.js

website:
  title: "CDEG in Australia · 成都环境集团·澳洲"
  search: true
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: "Home · 首页"
      - text: "Report · 报告"
        menu:
          - href: report/introduction.qmd
            text: "1 · Introduction · 引言"
          - href: report/market-context.qmd
            text: "2 · Market context · 市场背景"
          - href: report/opportunity.qmd
            text: "3 · Market opportunity · 市场机会"
          - href: report/customers.qmd
            text: "4 · Customer insights · 客户洞察"
          - href: report/competitors.qmd
            text: "5 · Competitor analysis · 竞争分析"
          - href: report/go-to-market.qmd
            text: "6–7 · Go-to-market plan · 进入市场计划"
      - text: "A · Business models · 商业模式"
        menu:
          - href: part-a/overview.qmd
            text: "Part A: Business models · A部分：商业模式"
          - href: part-a/wte.qmd
            text: "Waste-to-energy · 垃圾焚烧发电"
          - href: part-a/sludge-water.qmd
            text: "Sludge, biosolids and wastewater O&M · 污泥与污水运营"
          - href: part-a/organics.qmd
            text: "Food organics and anaerobic digestion · 厨余垃圾与厌氧消化"
          - href: part-a/meters.qmd
            text: "Smart water meters · 智能水表"
          - href: part-a/chemicals.qmd
            text: "Water-treatment chemicals · 水处理药剂"
      - text: "B · Compliance · 合规"
        menu:
          - href: part-b/overview.qmd
            text: "Part B: Compliance · B部分：合规"
          - href: part-b/pathways.qmd
            text: "Approval pathways · 审批路径"
          - href: part-b/shortcuts.qmd
            text: "Shortcuts and fast tracks · 审批捷径"
          - href: part-b/approval-experience.qmd
            text: "Who has done it before · 谁有审批经验"
          - href: part-b/china-comparison.qmd
            text: "Australia vs China regulation · 中澳监管对比"
      - text: "Models · 模型"
        menu:
          - href: models/overview.qmd
            text: "Interactive models · 互动模型"
          - href: models/wte-payback.qmd
            text: "WtE project payback · 垃圾发电项目回收期"
          - href: models/council-map.qmd
            text: "Council price map · 市政价格地图"
          - href: models/om-contract.qmd
            text: "O&M contract model · 委托运营模型"
          - href: models/meter-distributor.qmd
            text: "Smart water meter profit model · 智能水表盈利模型"
      - text: "Appendix · 附录"
        menu:
          - href: appendix/sources.qmd
            text: "Sources · 资料来源"
          - href: appendix/assumptions.qmd
            text: "Assumptions register · 假设参数"
          - href: appendix/glossary.qmd
            text: "Glossary · 术语表"
  page-footer:
    center: "[NexStar 2026 · CDEG–A team · Draft: figures marked “to verify” are not final]{.en}[NexStar 2026 · CDEG–A小组 · 草稿：标注“待核实”的数据尚未确定]{.zh}"

format:
  html:
    theme: [cosmo, assets/theme.scss]
    css: assets/lang.css
    include-in-header: assets/lang-toggle.html
    # Numbered citations like [2] link to the Sources page
    filters:
      - assets/cite-links.lua
    toc: true
    toc-depth: 3
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: true
    # No web fonts, MathJax or external CDNs, so the site loads inside mainland China
    html-math-method: plain
lang: en
